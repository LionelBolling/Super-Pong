name: Publish Pong
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and web templates
        shell: bash
        run: |
          curl -fL https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip
          mv Godot_v4.6.1-stable_linux.x86_64 godot
          curl -fL https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz -o templates.zip
          unzip -q templates.zip
          mkdir -p ~/.local/share/godot/export_templates/4.6.1.stable
          mv templates/* ~/.local/share/godot/export_templates/4.6.1.stable/
      - name: Export game
        run: |
          mkdir -p build/web
          ./godot --headless --editor --import --path .
          ./godot --headless --path . --export-release Web build/web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - uses: actions/deploy-pages@v4
        id: deployment
